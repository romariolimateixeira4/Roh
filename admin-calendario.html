<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071426"><meta name="robots" content="noindex,nofollow"><title>Calendário / Edital | Administração ROH</title><link rel="stylesheet" href="assets/roh.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="assets/roh-core.js"></script><script src="assets/roh-admin.js"></script></head><body>
<header class="topbar"><a class="brand" href="admin.html"><span class="brand-mark">R</span><span class="brand-text"><strong>ROH Concursos</strong><span>Calendário / Edital</span></span></a><div class="top-actions"><a class="btn-ghost" href="admin.html">Central</a><span class="user-email" data-user-email></span><button class="btn-ghost" data-logout>Sair</button></div></header>
<main class="page"><div class="eyebrow">Administração</div><h1 class="title">Calendário, edital e avisos</h1><p class="subtitle">Eventos publicados exigem fonte oficial. Evento publicado não é editado diretamente: use retificação para preservar histórico.</p>
<section class="panel panel-pad" style="margin-top:24px"><div class="grid grid-4"><div class="field"><label for="concurso">Concurso</label><select id="concurso"></select></div><div class="field"><label for="tipo">Tipo</label><select id="tipo"><option>edital</option><option>retificacao</option><option>inscricao</option><option>prova</option><option>gabarito</option><option>recurso</option><option>resultado</option><option>convocacao</option><option>aviso</option><option>outro</option></select></div><div class="field"><label for="inicio">Início</label><input id="inicio" type="datetime-local"></div><div class="field"><label for="fim">Fim</label><input id="fim" type="datetime-local"></div></div><div class="field" style="margin-top:14px"><label for="titulo">Título</label><input id="titulo"></div><div class="field" style="margin-top:14px"><label for="descricao">Descrição</label><textarea id="descricao"></textarea></div><div class="grid grid-2" style="margin-top:14px"><div class="field"><label for="fonteNome">Nome da fonte</label><input id="fonteNome" placeholder="Prefeitura / ICAP / Diário Oficial"></div><div class="field"><label for="fonteUrl">URL oficial</label><input id="fonteUrl" placeholder="https://..."></div></div><input id="eventoId" type="hidden"><input id="retificaOrigem" type="hidden"><div class="actions"><button id="salvar" class="btn-primary">Salvar rascunho</button><button id="novo" class="btn-ghost">Novo</button></div><div id="formStatus" class="notice" role="status" aria-live="polite" aria-atomic="true">Novo rascunho.</div></section>
<section class="panel panel-pad" style="margin-top:24px"><div class="actions"><button id="atualizar" class="btn-primary">Atualizar lista</button></div><div id="listaStatus" class="notice" role="status" aria-live="polite" aria-atomic="true">Carregando...</div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Evento</th><th>Datas</th><th>Fonte</th><th>Status</th><th>Versão</th><th>Ações</th></tr></thead><tbody id="lista"></tbody></table></div></section></main>
<script>
let eventos=[];window.addEventListener("DOMContentLoaded",async()=>{try{if(!await ROHAdmin.init())return;const cs=await ROH.rpc("roh_admin_concursos_v2")||[],s=ROH.el("concurso");s.innerHTML="";cs.forEach(c=>ROH.option(s,c.concurso_id,`${c.nome}${c.ano?` — ${c.ano}`:""}`));await listar()}catch(e){ROHAdmin.notice("listaStatus",e.message||"Falha ao iniciar.","error")}});ROH.el("concurso").addEventListener("change",listar);ROH.el("atualizar").addEventListener("click",listar);ROH.el("novo").addEventListener("click",limpar);
function iso(v){if(!v)return null;return new Date(v).toISOString()}function toLocal(v){if(!v)return"";const d=new Date(v),p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
function limpar(){ROH.el("eventoId").value="";ROH.el("retificaOrigem").value="";["titulo","descricao","inicio","fim","fonteNome","fonteUrl"].forEach(id=>ROH.el(id).value="");ROH.el("tipo").value="aviso";ROHAdmin.notice("formStatus","Novo rascunho.")}
ROH.el("salvar").addEventListener("click",async()=>{const b=ROH.el("salvar");ROHAdmin.busy(b,true,"Salvando...");try{let r;if(ROH.el("retificaOrigem").value){r=await ROH.rpc("roh_admin_criar_retificacao_evento_v1",{p_evento_origem_id:Number(ROH.el("retificaOrigem").value),p_tipo:ROH.el("tipo").value,p_titulo:ROH.el("titulo").value,p_descricao:ROH.el("descricao").value||null,p_data_inicio:iso(ROH.el("inicio").value),p_data_fim:iso(ROH.el("fim").value),p_fonte_nome:ROH.el("fonteNome").value,p_fonte_url:ROH.el("fonteUrl").value});}else{r=await ROH.rpc("roh_admin_salvar_evento_v1",{p_evento_id:ROH.el("eventoId").value?Number(ROH.el("eventoId").value):null,p_concurso_id:Number(ROH.el("concurso").value),p_tipo:ROH.el("tipo").value,p_titulo:ROH.el("titulo").value,p_descricao:ROH.el("descricao").value||null,p_data_inicio:iso(ROH.el("inicio").value),p_data_fim:iso(ROH.el("fim").value),p_fonte_nome:ROH.el("fonteNome").value,p_fonte_url:ROH.el("fonteUrl").value});}limpar();ROHAdmin.notice("formStatus",`Rascunho #${r.evento_id} salvo.`,"success");await listar()}catch(e){ROHAdmin.notice("formStatus",e.message||"Falha ao salvar.","error")}finally{ROHAdmin.busy(b,false)}});
function td(tr,v){const x=document.createElement("td");x.textContent=ROHAdmin.text(v);tr.appendChild(x)}async function listar(){try{const d=await ROH.rpc("roh_admin_listar_eventos_v1",{p_concurso_id:Number(ROH.el("concurso").value)||null,p_limite:200,p_offset:0});eventos=d.eventos||[];const tb=ROH.el("lista");tb.innerHTML="";eventos.forEach(e=>{const tr=document.createElement("tr");td(tr,e.id);td(tr,`${e.tipo} · ${e.titulo}`);td(tr,`${ROHAdmin.fmtDate(e.data_inicio)}${e.data_fim?` → ${ROHAdmin.fmtDate(e.data_fim)}`:""}`);const f=document.createElement("td"),a=document.createElement("a");a.href=e.fonte_url;a.target="_blank";a.rel="noopener noreferrer";a.textContent=e.fonte_nome;f.appendChild(a);tr.appendChild(f);td(tr,e.status);td(tr,e.versao);const z=document.createElement("td"),acts=document.createElement("div");acts.className="actions";if(e.status==="rascunho"){btn(acts,"Editar",()=>editar(e));btn(acts,"Publicar",()=>publicar(e),"btn-success")}if(e.status==="publicado"){btn(acts,"Retificar",()=>retificar(e));btn(acts,"Cancelar",()=>cancelar(e),"btn-danger")}z.appendChild(acts);tr.appendChild(z);tb.appendChild(tr)});ROHAdmin.notice("listaStatus",`${d.total||0} evento(s).`,"success")}catch(e){ROHAdmin.notice("listaStatus",e.message||"Falha ao listar.","error")}}
function btn(box,t,fn,cl="btn-ghost"){const b=document.createElement("button");b.className=cl;b.textContent=t;b.onclick=fn;box.appendChild(b)}function preencher(e){ROH.el("concurso").value=e.concurso_id;ROH.el("tipo").value=e.tipo;ROH.el("titulo").value=e.titulo||"";ROH.el("descricao").value=e.descricao||"";ROH.el("inicio").value=toLocal(e.data_inicio);ROH.el("fim").value=toLocal(e.data_fim);ROH.el("fonteNome").value=e.fonte_nome||"";ROH.el("fonteUrl").value=e.fonte_url||"";window.scrollTo({top:0,behavior:"smooth"})}function editar(e){limpar();ROH.el("eventoId").value=e.id;preencher(e);ROHAdmin.notice("formStatus",`Editando rascunho #${e.id}.`)}function retificar(e){limpar();ROH.el("retificaOrigem").value=e.id;preencher(e);ROH.el("tipo").value="retificacao";ROHAdmin.notice("formStatus",`Criando retificação do evento #${e.id}. A origem será substituída somente após publicação.`)}async function publicar(e){if(!confirm(`Publicar o evento #${e.id}?`))return;try{await ROH.rpc("roh_admin_publicar_evento_v1",{p_evento_id:e.id});await listar()}catch(x){alert(x.message||"Falha ao publicar.")}}async function cancelar(e){const m=prompt("Motivo do cancelamento (mín. 10 caracteres):");if(!m)return;try{await ROH.rpc("roh_admin_cancelar_evento_v1",{p_evento_id:e.id,p_motivo:m});await listar()}catch(x){alert(x.message||"Falha ao cancelar.")}}
</script></body></html>
