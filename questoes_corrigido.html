<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071426">

  <title>Questões | ROH Concursos</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --fundo: #071426;
      --fundo2: #0b1f38;
      --card: #102743;
      --card2: #0d2038;
      --dourado: #d7a83e;
      --dourado2: #f0c866;
      --branco: #ffffff;
      --texto: #dce5f0;
      --cinza: #9eacbd;
      --verde: #39c98d;
      --vermelho: #ef6464;
      --borda: rgba(255,255,255,.10);
    }

    body {
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--branco);
      background:
        radial-gradient(circle at top right, #173d68 0, transparent 35%),
        var(--fundo);
    }

    button,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    header {
      min-height: 72px;
      padding: 0 5vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 1px solid var(--borda);
      background: rgba(7,20,38,.94);
      backdrop-filter: blur(12px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .logo-marca {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      color: var(--fundo);
      background: linear-gradient(135deg, var(--dourado2), var(--dourado));
      font-weight: 900;
      font-size: 19px;
    }

    .logo-texto strong {
      display: block;
      font-size: 17px;
    }

    .logo-texto span {
      display: block;
      margin-top: 2px;
      color: var(--cinza);
      font-size: 11px;
    }

    .topo-direita {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .usuario {
      color: var(--cinza);
      font-size: 12px;
    }

    .btn-topo {
      padding: 9px 13px;
      border: 1px solid var(--borda);
      border-radius: 9px;
      color: var(--texto);
      background: rgba(255,255,255,.05);
      text-decoration: none;
    }

    .container {
      width: min(1250px, 92%);
      margin: 35px auto 70px;
    }

    .cabecalho span {
      color: var(--dourado2);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .cabecalho h1 {
      margin-top: 8px;
      font-size: clamp(29px, 4vw, 42px);
    }

    .cabecalho p {
      margin-top: 9px;
      color: var(--cinza);
      line-height: 1.6;
    }

    .filtros {
      margin-top: 28px;
      padding: 20px;
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr auto;
      align-items: end;
      gap: 13px;
      border: 1px solid var(--borda);
      border-radius: 17px;
      background: rgba(255,255,255,.045);
    }

    .campo label {
      display: block;
      margin-bottom: 7px;
      color: var(--cinza);
      font-size: 12px;
      font-weight: 700;
    }

    .campo select {
      width: 100%;
      height: 46px;
      padding: 0 12px;
      border: 1px solid var(--borda);
      border-radius: 9px;
      outline: none;
      color: var(--branco);
      background: var(--card2);
    }

    .campo select option {
      color: white;
      background: var(--fundo2);
    }

    .btn-buscar {
      height: 46px;
      padding: 0 20px;
      border: none;
      border-radius: 9px;
      color: var(--fundo);
      background: linear-gradient(135deg, var(--dourado2), var(--dourado));
      font-weight: 900;
    }

    .btn-buscar:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .stats {
      margin: 17px 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .stat {
      padding: 16px;
      border: 1px solid var(--borda);
      border-radius: 13px;
      background: rgba(255,255,255,.035);
    }

    .stat span {
      display: block;
      color: var(--cinza);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .stat strong {
      display: block;
      margin-top: 6px;
      font-size: 23px;
    }

    .mensagem {
      padding: 24px;
      border: 1px dashed var(--borda);
      border-radius: 15px;
      text-align: center;
      color: var(--cinza);
      background: rgba(255,255,255,.025);
    }

    .mensagem.erro {
      color: #ffc9c9;
      border-color: rgba(239,100,100,.4);
    }

    .questao-card {
      display: none;
      padding: clamp(20px, 4vw, 32px);
      border: 1px solid var(--borda);
      border-radius: 18px;
      background: linear-gradient(
        145deg,
        rgba(255,255,255,.065),
        rgba(255,255,255,.025)
      );
    }

    .questao-topo {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 20px;
    }

    .numero {
      color: var(--dourado2);
      font-size: 13px;
      font-weight: 900;
    }

    .dificuldade {
      padding: 6px 10px;
      border-radius: 999px;
      color: var(--cinza);
      background: rgba(255,255,255,.06);
      font-size: 11px;
      font-weight: 700;
    }

    .enunciado {
      color: var(--texto);
      font-size: 17px;
      line-height: 1.7;
      white-space: pre-line;
    }

    .alternativas {
      margin-top: 23px;
      display: grid;
      gap: 10px;
    }

    .alternativa {
      width: 100%;
      padding: 14px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      border: 1px solid var(--borda);
      border-radius: 11px;
      text-align: left;
      color: var(--texto);
      background: rgba(255,255,255,.035);
    }

    .alternativa:hover:not(:disabled) {
      border-color: rgba(240,200,102,.45);
      background: rgba(240,200,102,.06);
    }

    .letra {
      flex: 0 0 30px;
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: var(--dourado2);
      background: rgba(215,168,62,.13);
      font-size: 12px;
      font-weight: 900;
    }

    .alternativa.correta {
      border-color: var(--verde);
      background: rgba(57,201,141,.10);
    }

    .alternativa.errada {
      border-color: var(--vermelho);
      background: rgba(239,100,100,.10);
    }

    .resultado {
      display: none;
      margin-top: 22px;
      padding: 17px;
      border-radius: 12px;
      line-height: 1.6;
    }

    .resultado.acerto {
      display: block;
      border: 1px solid rgba(57,201,141,.35);
      background: rgba(57,201,141,.09);
    }

    .resultado.erro {
      display: block;
      border: 1px solid rgba(239,100,100,.35);
      background: rgba(239,100,100,.09);
    }

    .resultado-titulo {
      font-weight: 900;
    }

    .explicacao {
      margin-top: 12px;
      color: var(--texto);
      font-size: 14px;
    }

    .base-legal {
      margin-top: 10px;
      color: var(--cinza);
      font-size: 12px;
    }

    .acoes {
      display: none;
      margin-top: 20px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .acoes.visivel {
      display: flex;
    }

    .btn-revisao,
    .btn-proxima {
      min-height: 43px;
      padding: 0 16px;
      border-radius: 9px;
      font-weight: 800;
    }

    .btn-revisao {
      border: 1px solid var(--borda);
      color: var(--texto);
      background: rgba(255,255,255,.05);
    }

    .btn-proxima {
      margin-left: auto;
      border: none;
      color: var(--fundo);
      background: var(--dourado2);
    }

    @media (max-width: 900px) {
      .filtros {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 650px) {
      header {
        min-height: 65px;
        padding: 10px 4vw;
      }

      .usuario,
      .logo-texto span,
      .btn-area {
        display: none;
      }

      .container {
        width: 94%;
        margin-top: 25px;
      }

      .filtros {
        grid-template-columns: 1fr;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .btn-buscar {
        width: 100%;
      }

      .btn-proxima {
        width: 100%;
        margin-left: 0;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">

    <div class="logo-marca">
      R
    </div>

    <div class="logo-texto">
      <strong>ROH Concursos</strong>
      <span>Área do aluno</span>
    </div>

  </div>

  <div class="topo-direita">

    <a
      href="area.html"
      class="btn-topo btn-area"
    >
      Área do aluno
    </a>

    <span
      id="usuarioEmail"
      class="usuario"
    >
      Carregando...
    </span>

    <button
      id="btnSair"
      class="btn-topo"
      type="button"
    >
      Sair
    </button>

  </div>

</header>

<main class="container">

  <section class="cabecalho">

    <span>Banco de questões</span>

    <h1>Pratique por assunto</h1>

    <p>
      Escolha seu cargo, disciplina e assunto
      para iniciar seus estudos.
    </p>

  </section>

  <section class="filtros">

    <div class="campo">

      <label for="cargo">
        Cargo
      </label>

      <select id="cargo">
        <option value="">
          Carregando cargos...
        </option>
      </select>

    </div>

    <div class="campo">

      <label for="disciplina">
        Disciplina
      </label>

      <select
        id="disciplina"
        disabled
      >
        <option value="">
          Selecione o cargo
        </option>
      </select>

    </div>

    <div class="campo">

      <label for="assunto">
        Assunto
      </label>

      <select
        id="assunto"
        disabled
      >
        <option value="">
          Todos os assuntos
        </option>
      </select>

    </div>

    <button
      id="btnBuscar"
      class="btn-buscar"
      type="button"
      disabled
    >
      Buscar questões
    </button>

  </section>

  <section class="stats">

    <div class="stat">
      <span>Respondidas</span>
      <strong id="statRespondidas">0</strong>
    </div>

    <div class="stat">
      <span>Acertos</span>
      <strong id="statAcertos">0</strong>
    </div>

    <div class="stat">
      <span>Erros</span>
      <strong id="statErros">0</strong>
    </div>

    <div class="stat">
      <span>Aproveitamento</span>
      <strong id="statPercentual">0%</strong>
    </div>

  </section>

  <div
    id="mensagem"
    class="mensagem"
  >
    Carregando...
  </div>

  <article
    id="questaoCard"
    class="questao-card"
  >

    <div class="questao-topo">

      <div
        id="questaoNumero"
        class="numero"
      ></div>

      <div
        id="questaoDificuldade"
        class="dificuldade"
      ></div>

    </div>

    <div
      id="enunciado"
      class="enunciado"
    ></div>

    <div
      id="alternativas"
      class="alternativas"
    ></div>

    <div
      id="resultado"
      class="resultado"
    ></div>

    <div
      id="acoes"
      class="acoes"
    >

      <button
        id="btnRevisao"
        class="btn-revisao"
        type="button"
      >
        ☆ Marcar para revisão
      </button>

      <button
        id="btnProxima"
        class="btn-proxima"
        type="button"
      >
        Próxima questão →
      </button>

    </div>

  </article>

</main>

<script>
  const SUPABASE_URL =
    "https://tvbnkjirfryluhxwpnna.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_rCGzxynHFKgEeajIAWHNAw_7Qyw9HD_";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  const cargoSelect =
    document.getElementById("cargo");

  const disciplinaSelect =
    document.getElementById("disciplina");

  const assuntoSelect =
    document.getElementById("assunto");

  const btnBuscar =
    document.getElementById("btnBuscar");

  const btnSair =
    document.getElementById("btnSair");

  const usuarioEmail =
    document.getElementById("usuarioEmail");

  const mensagem =
    document.getElementById("mensagem");

  const questaoCard =
    document.getElementById("questaoCard");

  const questaoNumero =
    document.getElementById("questaoNumero");

  const questaoDificuldade =
    document.getElementById("questaoDificuldade");

  const enunciado =
    document.getElementById("enunciado");

  const alternativas =
    document.getElementById("alternativas");

  const resultado =
    document.getElementById("resultado");

  const acoes =
    document.getElementById("acoes");

  const btnRevisao =
    document.getElementById("btnRevisao");

  const btnProxima =
    document.getElementById("btnProxima");

  const statRespondidas =
    document.getElementById("statRespondidas");

  const statAcertos =
    document.getElementById("statAcertos");

  const statErros =
    document.getElementById("statErros");

  const statPercentual =
    document.getElementById("statPercentual");

  let questoes = [];
  let indiceAtual = 0;
  let questaoAtual = null;
  let respondida = false;

  let stats = {
    respondidas: 0,
    acertos: 0,
    erros: 0
  };

  function texto(valor) {
    if (
      valor === null ||
      valor === undefined
    ) {
      return "";
    }

    return String(valor);
  }

  function mostrarMensagem(
    textoMensagem,
    erro = false
  ) {
    questaoCard.style.display =
      "none";

    mensagem.style.display =
      "block";

    mensagem.textContent =
      textoMensagem;

    mensagem.className =
      erro
        ? "mensagem erro"
        : "mensagem";
  }

  function esconderMensagem() {
    mensagem.style.display =
      "none";
  }

  function atualizarStats() {
    statRespondidas.textContent =
      stats.respondidas;

    statAcertos.textContent =
      stats.acertos;

    statErros.textContent =
      stats.erros;

    const percentual =
      stats.respondidas
        ? Math.round(
            (
              stats.acertos /
              stats.respondidas
            ) * 100
          )
        : 0;

    statPercentual.textContent =
      percentual + "%";
  }

  async function verificarUsuario() {
    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .getSession();

    if (
      error ||
      !data.session
    ) {
      window.location.href =
        "login.html";

      return false;
    }

    usuarioEmail.textContent =
      data.session.user.email ||
      "Aluno";

    const {
      data: ativo,
      error: erroAtivo
    } =
      await supabaseClient.rpc(
        "roh_usuario_ativo"
      );

    if (
      erroAtivo ||
      ativo !== true
    ) {
      await supabaseClient.auth.signOut();

      alert(
        "Seu acesso à ROH Concursos não está ativo."
      );

      window.location.href =
        "login.html";

      return false;
    }

    return true;
  }

  async function carregarOpcoes(
    cargoId = null,
    disciplinaId = null
  ) {
    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "roh_opcoes_estudo_v1",
        {
          p_cargo_id:
            cargoId
              ? Number(cargoId)
              : null,

          p_disciplina_id:
            disciplinaId
              ? Number(disciplinaId)
              : null
        }
      );

    if (error) {
      console.error(
        "ROH opções:",
        error
      );

      throw error;
    }

    return data || {
      cargos: [],
      disciplinas: [],
      assuntos: []
    };
  }

  function criarOption(
    id,
    nome
  ) {
    const option =
      document.createElement(
        "option"
      );

    option.value =
      String(id);

    option.textContent =
      nome;

    return option;
  }

  async function carregarCargos() {
    cargoSelect.disabled =
      true;

    cargoSelect.innerHTML =
      '<option value="">Carregando...</option>';

    try {
      const dados =
        await carregarOpcoes();

      const cargos =
        Array.isArray(dados.cargos)
          ? dados.cargos
          : [];

      cargoSelect.innerHTML =
        '<option value="">Selecione seu cargo</option>';

      cargos.forEach(item => {
        const id =
          item.cargo_id ??
          item.id;

        const nome =
          item.cargo_nome ??
          item.nome ??
          item.cargo;

        if (
          id !== undefined &&
          id !== null &&
          nome
        ) {
          cargoSelect.appendChild(
            criarOption(
              id,
              nome
            )
          );
        }
      });

      cargoSelect.disabled =
        false;

      if (!cargos.length) {
        mostrarMensagem(
          "Nenhum cargo foi encontrado para sua conta."
        );

        return;
      }

      mostrarMensagem(
        "Selecione seu cargo para começar."
      );

    } catch (erro) {
      console.error(erro);

      mostrarMensagem(
        "Não foi possível carregar seus cargos.",
        true
      );
    }
  }

  cargoSelect.addEventListener(
    "change",
    async () => {
      const cargoId =
        cargoSelect.value;

      disciplinaSelect.disabled =
        true;

      assuntoSelect.disabled =
        true;

      btnBuscar.disabled =
        true;

      disciplinaSelect.innerHTML =
        '<option value="">Selecione o cargo</option>';

      assuntoSelect.innerHTML =
        '<option value="">Todos os assuntos</option>';

      if (!cargoId) {
        mostrarMensagem(
          "Selecione seu cargo para começar."
        );

        return;
      }

      mostrarMensagem(
        "Carregando disciplinas..."
      );

      try {
        const dados =
          await carregarOpcoes(
            cargoId,
            null
          );

        const disciplinas =
          Array.isArray(
            dados.disciplinas
          )
            ? dados.disciplinas
            : [];

        disciplinaSelect.innerHTML =
          '<option value="">Selecione a disciplina</option>';

        disciplinas.forEach(item => {
          const id =
            item.disciplina_id ??
            item.id;

          const nome =
            item.disciplina_nome ??
            item.nome ??
            item.disciplina;

          if (
            id !== undefined &&
            id !== null &&
            nome
          ) {
            disciplinaSelect.appendChild(
              criarOption(
                id,
                nome
              )
            );
          }
        });

        disciplinaSelect.disabled =
          false;

        if (!disciplinas.length) {
          mostrarMensagem(
            "Nenhuma disciplina foi encontrada para este cargo."
          );

          return;
        }

        mostrarMensagem(
          "Agora selecione uma disciplina."
        );

      } catch (erro) {
        console.error(erro);

        mostrarMensagem(
          "Não foi possível carregar as disciplinas.",
          true
        );
      }
    }
  );

  disciplinaSelect.addEventListener(
    "change",
    async () => {
      const cargoId =
        cargoSelect.value;

      const disciplinaId =
        disciplinaSelect.value;

      assuntoSelect.disabled =
        true;

      btnBuscar.disabled =
        true;

      assuntoSelect.innerHTML =
        '<option value="">Todos os assuntos</option>';

      if (!disciplinaId) {
        mostrarMensagem(
          "Selecione uma disciplina."
        );

        return;
      }

      mostrarMensagem(
        "Carregando assuntos..."
      );

      try {
        const dados =
          await carregarOpcoes(
            cargoId,
            disciplinaId
          );

        const assuntos =
          Array.isArray(
            dados.assuntos
          )
            ? dados.assuntos
            : [];

        assuntoSelect.innerHTML =
          '<option value="">Todos os assuntos</option>';

        assuntos.forEach(item => {
          const id =
            item.assunto_id ??
            item.id;

          const nome =
            item.assunto_nome ??
            item.nome ??
            item.assunto;

          if (
            id !== undefined &&
            id !== null &&
            nome
          ) {
            assuntoSelect.appendChild(
              criarOption(
                id,
                nome
              )
            );
          }
        });

        assuntoSelect.disabled =
          false;

        btnBuscar.disabled =
          false;

        mostrarMensagem(
          "Escolha um assunto ou mantenha “Todos os assuntos” e clique em Buscar questões."
        );

      } catch (erro) {
        console.error(erro);

        mostrarMensagem(
          "Não foi possível carregar os assuntos.",
          true
        );
      }
    }
  );

  btnBuscar.addEventListener(
    "click",
    async () => {
      const cargoId =
        cargoSelect.value;

      const disciplinaId =
        disciplinaSelect.value;

      const assuntoId =
        assuntoSelect.value;

      if (
        !cargoId ||
        !disciplinaId
      ) {
        mostrarMensagem(
          "Selecione cargo e disciplina.",
          true
        );

        return;
      }

      btnBuscar.disabled =
        true;

      btnBuscar.textContent =
        "Buscando...";

      mostrarMensagem(
        "Buscando questões..."
      );

      try {
        const {
          data,
          error
        } =
          await supabaseClient.rpc(
            "roh_listar_questoes_estudo_v1",
            {
              p_cargo_id:
                Number(cargoId),

              p_disciplina_id:
                Number(disciplinaId),

              p_assunto_id:
                assuntoId
                  ? Number(assuntoId)
                  : null,

              p_dificuldade:
                null,

              p_quantidade:
                50,

              p_somente_erros:
                false,

              p_somente_nao_respondidas:
                false
            }
          );

        if (error) {
          throw error;
        }

        if (Array.isArray(data)) {
          questoes = data;
        } else if (
          data &&
          Array.isArray(data.questoes)
        ) {
          questoes =
            data.questoes;
        } else {
          questoes = [];
        }

        indiceAtual = 0;

        if (!questoes.length) {
          mostrarMensagem(
            "Nenhuma questão disponível para os filtros selecionados."
          );

          return;
        }

        exibirQuestao();

      } catch (erro) {
        console.error(
          "ROH questões:",
          erro
        );

        mostrarMensagem(
          "Não foi possível carregar as questões.",
          true
        );

      } finally {
        btnBuscar.disabled =
          false;

        btnBuscar.textContent =
          "Buscar questões";
      }
    }
  );

  function normalizarQuestao(q) {
    const lista = [];

    const alternativasObjeto =
      q.alternativas &&
      typeof q.alternativas === "object"
        ? q.alternativas
        : {};

    ["A", "B", "C", "D", "E"]
      .forEach(letra => {
        const minuscula =
          letra.toLowerCase();

        const valor =
          q["alternativa_" + minuscula]
          ??
          q["alternativa_" + letra]
          ??
          q["alternativa" + letra]
          ??
          alternativasObjeto[letra]
          ??
          alternativasObjeto[minuscula]
          ??
          null;

        if (
          valor !== null &&
          valor !== undefined &&
          String(valor).trim() !== ""
        ) {
          lista.push({
            letra,
            texto: String(valor)
          });
        }
      });

    return {
      id:
        q.questao_id ??
        q.id,

      enunciado:
        texto(
          q.enunciado ??
          q.questao ??
          q.texto
        ),

      dificuldade:
        texto(
          q.dificuldade ??
          ""
        ),

      alternativas:
        lista
    };
  }

  function exibirQuestao() {
    if (
      indiceAtual >=
      questoes.length
    ) {
      mostrarMensagem(
        "Você concluiu as questões carregadas."
      );

      return;
    }

    questaoAtual =
      normalizarQuestao(
        questoes[indiceAtual]
      );

    respondida = false;

    esconderMensagem();

    questaoCard.style.display =
      "block";

    questaoNumero.textContent =
      "Questão " +
      (indiceAtual + 1) +
      " de " +
      questoes.length;

    questaoDificuldade.textContent =
      questaoAtual.dificuldade ||
      "Questão";

    enunciado.textContent =
      questaoAtual.enunciado;

    alternativas.innerHTML = "";

    resultado.innerHTML = "";

    resultado.className =
      "resultado";

    acoes.className =
      "acoes";

    btnRevisao.textContent =
      "☆ Marcar para revisão";

    questaoAtual.alternativas
      .forEach(opcao => {
        const botao =
          document.createElement(
            "button"
          );

        botao.type =
          "button";

        botao.className =
          "alternativa";

        botao.dataset.letra =
          opcao.letra;

        const letra =
          document.createElement(
            "span"
          );

        letra.className =
          "letra";

        letra.textContent =
          opcao.letra;

        const descricao =
          document.createElement(
            "span"
          );

        descricao.textContent =
          opcao.texto;

        botao.appendChild(
          letra
        );

        botao.appendChild(
          descricao
        );

        botao.addEventListener(
          "click",
          () =>
            responderQuestao(
              opcao.letra
            )
        );

        alternativas.appendChild(
          botao
        );
      });

    window.scrollTo({
      top:
        Math.max(
          questaoCard.offsetTop - 100,
          0
        ),
      behavior: "smooth"
    });
  }

  async function responderQuestao(
    respostaAluno
  ) {
    if (
      respondida ||
      !questaoAtual
    ) {
      return;
    }

    const botoes =
      alternativas.querySelectorAll(
        ".alternativa"
      );

    botoes.forEach(
      botao =>
        botao.disabled = true
    );

    try {
      const {
        data,
        error
      } =
        await supabaseClient.rpc(
          "roh_responder_questao",
          {
            p_questao_id:
              Number(
                questaoAtual.id
              ),

            p_resposta:
              respostaAluno,

            p_origem:
              "questoes"
          }
        );

      if (error) {
        throw error;
      }

      const r =
        data || {};

      const acertou =
        r.acertou
        ??
        r.correto
        ??
        r.is_correct
        ??
        false;

      const correta =
        r.resposta_correta
        ??
        r.correta
        ??
        r.gabarito
        ??
        r.correta_resposta
        ??
        r.alternativa_correta
        ??
        r.gabarito_ce
        ??
        null;

      const explicacao =
        r.explicacao ?? "";

      const baseLegal =
        r.base_legal ?? "";

      respondida = true;

      botoes.forEach(botao => {
        const letra =
          botao.dataset.letra;

        if (
          correta &&
          letra === String(correta)
        ) {
          botao.classList.add(
            "correta"
          );
        }

        if (
          !acertou &&
          letra === respostaAluno
        ) {
          botao.classList.add(
            "errada"
          );
        }
      });

      stats.respondidas++;

      if (acertou) {
        stats.acertos++;
      } else {
        stats.erros++;
      }

      atualizarStats();

      resultado.className =
        acertou
          ? "resultado acerto"
          : "resultado erro";

      const titulo =
        document.createElement(
          "div"
        );

      titulo.className =
        "resultado-titulo";

      titulo.textContent =
        acertou
          ? "✓ Resposta correta!"
          : "✗ Resposta incorreta.";

      resultado.appendChild(
        titulo
      );

      if (explicacao) {
        const exp =
          document.createElement(
            "div"
          );

        exp.className =
          "explicacao";

        exp.textContent =
          explicacao;

        resultado.appendChild(
          exp
        );
      }

      if (baseLegal) {
        const base =
          document.createElement(
            "div"
          );

        base.className =
          "base-legal";

        base.textContent =
          "Base legal/referência: " +
          baseLegal;

        resultado.appendChild(
          base
        );
      }

      acoes.className =
        "acoes visivel";

    } catch (erro) {
      console.error(
        "ROH resposta:",
        erro
      );

      botoes.forEach(
        botao =>
          botao.disabled = false
      );

      alert(
        "Não foi possível registrar sua resposta."
      );
    }
  }

  btnProxima.addEventListener(
    "click",
    () => {
      indiceAtual++;
      exibirQuestao();
    }
  );

  btnRevisao.addEventListener(
    "click",
    async () => {
      if (
        !questaoAtual ||
        !respondida
      ) {
        return;
      }

      btnRevisao.disabled =
        true;

      try {
        const {
          error
        } =
          await supabaseClient.rpc(
            "roh_marcar_revisao",
            {
              p_questao_id:
                Number(
                  questaoAtual.id
                )
            }
          );

        if (error) {
          throw error;
        }

        btnRevisao.textContent =
          "★ Marcada para revisão";

      } catch (erro) {
        console.error(
          "ROH revisão:",
          erro
        );

        alert(
          "Não foi possível marcar esta questão para revisão."
        );

      } finally {
        btnRevisao.disabled =
          false;
      }
    }
  );

  btnSair.addEventListener(
    "click",
    async () => {
      await supabaseClient
        .auth
        .signOut();

      window.location.href =
        "login.html";
    }
  );

  async function iniciar() {
    mostrarMensagem(
      "Verificando sua conta..."
    );

    try {
      const ok =
        await verificarUsuario();

      if (!ok) {
        return;
      }

      mostrarMensagem(
        "Carregando seus cargos..."
      );

      await carregarCargos();

    } catch (erro) {
      console.error(
        "ROH inicialização:",
        erro
      );

      mostrarMensagem(
        "Não foi possível iniciar a área de questões.",
        true
      );
    }
  }

  iniciar();
</script>
