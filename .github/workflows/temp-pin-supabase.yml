name: Temporary Supabase JS Pin

on:
  push:
    branches:
      - v5-4-pin-supabase-js

permissions:
  contents: write

jobs:
  pin:
    if: "${{ !contains(github.event.head_commit.message, 'chore: pin supabase-js 2.116.0') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v5-4-pin-supabase-js
      - name: Pin Supabase JS exactly
        run: |
          python - <<'PY'
          from pathlib import Path
          old = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'
          new = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0'
          changed = []
          replacements = 0
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count:
                  path.write_text(text.replace(old, new), encoding='utf-8')
                  replacements += count
                  changed.append(str(path))
          print(f'Replacements: {replacements}')
          print('\n'.join(changed))
          if replacements == 0:
              raise SystemExit('No Supabase JS @2 references found')
          PY
      - name: Commit pin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore: pin supabase-js 2.116.0"
          git push origin HEAD:v5-4-pin-supabase-js
