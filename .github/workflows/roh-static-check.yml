name: ROH Static Checks

on:
  push:
    branches:
      - main
      - beta-2026-09-13
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate frontend integrity and security
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import subprocess
          import tempfile
          import sys
          from urllib.parse import urlsplit

          root = Path('.').resolve()
          html_files = sorted(root.glob('*.html'))
          js_files = sorted((root / 'assets').glob('*.js'))
          css_files = sorted((root / 'assets').glob('*.css'))
          errors = []
          inline_checked = 0

          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.refs = []
                  self.in_script = False
                  self.script_has_src = False
                  self.script_parts = []
                  self.inline_scripts = []
                  self.has_viewport = False
                  self.robots = ''

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  tag = tag.lower()
                  for key in ('href', 'src'):
                      value = attrs.get(key)
                      if value:
                          self.refs.append(value.strip())
                  if tag == 'meta':
                      name = str(attrs.get('name', '')).lower()
                      if name == 'viewport':
                          self.has_viewport = True
                      elif name == 'robots':
                          self.robots = str(attrs.get('content', '')).lower()
                  if tag == 'script':
                      self.in_script = True
                      self.script_has_src = bool(attrs.get('src'))
                      self.script_parts = []

              def handle_endtag(self, tag):
                  if tag.lower() == 'script' and self.in_script:
                      if not self.script_has_src:
                          code = ''.join(self.script_parts).strip()
                          if code:
                              self.inline_scripts.append(code)
                      self.in_script = False
                      self.script_has_src = False
                      self.script_parts = []

              def handle_data(self, data):
                  if self.in_script and not self.script_has_src:
                      self.script_parts.append(data)

          def local_target(page, ref):
              if not ref or ref.startswith(('#', 'data:', 'mailto:', 'tel:', 'javascript:')):
                  return None
              parsed = urlsplit(ref)
              if parsed.scheme or parsed.netloc:
                  return None
              path = parsed.path
              if not path or path.startswith('/'):
                  return None
              return (page.parent / path).resolve()

          for page in html_files:
              parser = PageParser()
              try:
                  parser.feed(page.read_text(encoding='utf-8'))
              except Exception as exc:
                  errors.append(f'{page.name}: HTML parser failed: {exc}')
                  continue

              if not parser.has_viewport and not page.name.startswith('google'):
                  errors.append(f'{page.name}: missing viewport meta tag')

              if page.name.startswith('admin'):
                  robots = {x.strip() for x in parser.robots.split(',') if x.strip()}
                  if not {'noindex', 'nofollow'}.issubset(robots):
                      errors.append(f'{page.name}: admin page must include robots noindex,nofollow')

              for ref in parser.refs:
                  target = local_target(page, ref)
                  if target is None:
                      continue
                  try:
                      target.relative_to(root)
                  except ValueError:
                      errors.append(f'{page.name}: reference escapes repository: {ref}')
                      continue
                  if not target.exists():
                      errors.append(f'{page.name}: missing local reference: {ref}')

              for idx, code in enumerate(parser.inline_scripts, start=1):
                  with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8', delete=False) as f:
                      f.write(code)
                      tmp = Path(f.name)
                  result = subprocess.run(['node', '--check', str(tmp)], capture_output=True, text=True)
                  tmp.unlink(missing_ok=True)
                  inline_checked += 1
                  if result.returncode != 0:
                      errors.append(f'{page.name}: inline script #{idx}: {result.stderr.strip()}')

          for js in js_files:
              result = subprocess.run(['node', '--check', str(js)], capture_output=True, text=True)
              if result.returncode != 0:
                  errors.append(f'{js.relative_to(root)}: {result.stderr.strip()}')

          # Prevent privileged credentials from entering browser-delivered files.
          # Strings are assembled so the workflow file itself does not contain a live-looking secret token.
          forbidden = [
              'service' + '_role',
              'MERCADO' + 'PAGO_ACCESS_TOKEN',
              'MERCADO' + 'PAGO_WEBHOOK_SECRET',
              'sb_' + 'secret_',
          ]
          browser_files = html_files + js_files + css_files
          for path in browser_files:
              text = path.read_text(encoding='utf-8', errors='replace')
              for token in forbidden:
                  if token in text:
                      errors.append(f'{path.relative_to(root)}: forbidden privileged token reference: {token}')

          print(f'HTML pages checked: {len(html_files)}')
          print(f'Inline scripts checked: {inline_checked}')
          print(f'Asset JS files checked: {len(js_files)}')
          print(f'Browser files scanned for privileged tokens: {len(browser_files)}')

          if errors:
              print('\nStatic check failures:', file=sys.stderr)
              for error in errors:
                  print(f'- {error}', file=sys.stderr)
              sys.exit(1)

          print('ROH static and security checks passed.')
          PY
