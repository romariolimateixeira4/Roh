<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071426">

  <title>Questões | ROH Concursos</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --fundo: #071426;
      --fundo2: #0b1f38;
      --card: #102743;
      --card2: #0d2038;
      --borda: rgba(255,255,255,.10);

      --dourado: #d7a83e;
      --dourado2: #f0c866;

      --branco: #ffffff;
      --texto: #dce5f0;
      --cinza: #9eacbd;

      --verde: #39c98d;
      --vermelho: #ef6464;
      --azul: #4b9cff;
    }

    body {
      min-height: 100vh;

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        radial-gradient(
          circle at top right,
          #173d68 0,
          transparent 35%
        ),
        var(--fundo);

      color: var(--branco);
    }

    button,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    header {
      height: 72px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 5vw;

      border-bottom: 1px solid var(--borda);

      background: rgba(7,20,38,.88);

      backdrop-filter: blur(14px);

      position: sticky;
      top: 0;
      z-index: 20;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .logo-marca {
      width: 42px;
      height: 42px;

      display: grid;
      place-items: center;

      border-radius: 12px;

      color: var(--fundo);

      background:
        linear-gradient(
          135deg,
          var(--dourado2),
          var(--dourado)
        );

      font-size: 19px;
      font-weight: 900;
    }

    .logo-texto strong {
      display: block;
      font-size: 17px;
    }

    .logo-texto span {
      display: block;
      margin-top: 2px;

      color: var(--cinza);
      font-size: 11px;
    }

    .topo-direita {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .usuario {
      color: var(--cinza);
      font-size: 13px;
    }

    .btn-area,
    .btn-sair {
      padding: 9px 14px;

      border: 1px solid var(--borda);
      border-radius: 9px;

      color: var(--texto);
      background: rgba(255,255,255,.05);

      text-decoration: none;
    }

    .btn-area:hover,
    .btn-sair:hover {
      background: rgba(255,255,255,.09);
    }

    .container {
      width: min(1280px, 92%);
      margin: 32px auto 60px;
    }

    .cabecalho-pagina {
      margin-bottom: 25px;
    }

    .cabecalho-pagina span {
      color: var(--dourado2);

      font-size: 12px;
      font-weight: 800;

      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .cabecalho-pagina h1 {
      margin-top: 7px;

      font-size: clamp(27px, 4vw, 40px);
    }

    .cabecalho-pagina p {
      margin-top: 8px;

      color: var(--cinza);

      line-height: 1.6;
    }

    .filtros {
      padding: 20px;

      display: grid;

      grid-template-columns:
        1.4fr
        1fr
        1fr
        auto;

      gap: 13px;
      align-items: end;

      border: 1px solid var(--borda);
      border-radius: 17px;

      background:
        rgba(255,255,255,.045);
    }

    .campo label {
      display: block;

      margin-bottom: 7px;

      color: var(--cinza);

      font-size: 12px;
      font-weight: 700;
    }

    .campo select {
      width: 100%;
      height: 46px;

      padding: 0 12px;

      outline: none;

      border: 1px solid var(--borda);
      border-radius: 9px;

      color: var(--branco);
      background: var(--card2);
    }

    .campo select:focus {
      border-color: rgba(240,200,102,.55);
    }

    .campo select option {
      background: var(--fundo2);
      color: var(--branco);
    }

    .btn-carregar {
      height: 46px;

      padding: 0 22px;

      border: none;
      border-radius: 9px;

      color: var(--fundo);

      background:
        linear-gradient(
          135deg,
          var(--dourado2),
          var(--dourado)
        );

      font-weight: 900;
    }

    .btn-carregar:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);

      gap: 12px;

      margin: 17px 0;
    }

    .stat {
      padding: 16px;

      border: 1px solid var(--borda);
      border-radius: 13px;

      background: rgba(255,255,255,.035);
    }

    .stat span {
      display: block;

      color: var(--cinza);

      font-size: 11px;
      font-weight: 700;

      text-transform: uppercase;
    }

    .stat strong {
      display: block;

      margin-top: 5px;

      font-size: 22px;
    }

    .questao-card {
      display: none;

      padding: clamp(20px, 4vw, 32px);

      border: 1px solid var(--borda);
      border-radius: 19px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.065),
          rgba(255,255,255,.025)
        );

      box-shadow:
        0 30px 70px rgba(0,0,0,.16);
    }

    .questao-topo {
      display: flex;
      justify-content: space-between;
      gap: 15px;

      margin-bottom: 19px;
    }

    .questao-numero {
      color: var(--dourado2);

      font-size: 13px;
      font-weight: 800;
    }

    .dificuldade {
      padding: 6px 10px;

      border-radius: 999px;

      color: var(--cinza);

      background: rgba(255,255,255,.06);

      font-size: 11px;
      font-weight: 700;
    }

    .enunciado {
      color: var(--texto);

      font-size: 17px;
      line-height: 1.7;

      white-space: pre-line;
    }

    .alternativas {
      display: grid;
      gap: 10px;

      margin-top: 24px;
    }

    .alternativa {
      width: 100%;

      display: flex;
      align-items: flex-start;
      gap: 12px;

      padding: 15px;

      text-align: left;

      border: 1px solid var(--borda);
      border-radius: 11px;

      color: var(--texto);

      background: rgba(255,255,255,.035);

      transition: .18s ease;
    }

    .alternativa:hover:not(:disabled) {
      border-color: rgba(240,200,102,.45);
      background: rgba(240,200,102,.06);
    }

    .letra {
      flex: 0 0 29px;

      width: 29px;
      height: 29px;

      display: grid;
      place-items: center;

      border-radius: 8px;

      color: var(--dourado2);

      background: rgba(215,168,62,.12);

      font-size: 12px;
      font-weight: 900;
    }

    .alternativa.correta {
      border-color: rgba(57,201,141,.65);
      background: rgba(57,201,141,.11);
    }

    .alternativa.errada {
      border-color: rgba(239,100,100,.65);
      background: rgba(239,100,100,.10);
    }

    .alternativa:disabled {
      cursor: default;
    }

    .resultado {
      display: none;

      margin-top: 23px;
      padding: 17px;

      border-radius: 12px;

      line-height: 1.6;
    }

    .resultado.acerto {
      display: block;

      border: 1px solid rgba(57,201,141,.28);

      background: rgba(57,201,141,.09);
    }

    .resultado.erro {
      display: block;

      border: 1px solid rgba(239,100,100,.28);

      background: rgba(239,100,100,.08);
    }

    .resultado-titulo {
      font-weight: 900;
    }

    .explicacao {
      margin-top: 12px;

      color: var(--texto);

      font-size: 14px;
    }

    .base-legal {
      margin-top: 10px;

      color: var(--cinza);

      font-size: 12px;
    }

    .acoes {
      display: none;

      margin-top: 20px;

      gap: 10px;
      flex-wrap: wrap;
    }

    .acoes.visivel {
      display: flex;
    }

    .btn-secundario,
    .btn-proxima {
      min-height: 43px;

      padding: 0 16px;

      border-radius: 9px;

      font-weight: 800;
    }

    .btn-secundario {
      border: 1px solid var(--borda);

      color: var(--texto);

      background: rgba(255,255,255,.05);
    }

    .btn-proxima {
      margin-left: auto;

      border: none;

      color: var(--fundo);

      background: var(--dourado2);
    }

    .mensagem {
      padding: 24px;

      text-align: center;

      border: 1px dashed var(--borda);
      border-radius: 15px;

      color: var(--cinza);

      background: rgba(255,255,255,.025);
    }

    .mensagem.erro {
      color: #ffc8c8;

      border-color: rgba(239,100,100,.30);
    }

    @media (max-width: 900px) {

      .filtros {
        grid-template-columns: 1fr 1fr;
      }

      .btn-carregar {
        width: 100%;
      }
    }

    @media (max-width: 650px) {

      header {
        height: auto;
        min-height: 65px;
        padding: 10px 4vw;
        gap: 10px;
        flex-wrap: wrap;
      }

      .logo-texto span,
      .usuario {
        display: none;
      }

      .logo-marca {
        width: 38px;
        height: 38px;
      }

      .topo-direita {
        margin-left: auto;
      }

      .btn-area {
        display: none;
      }

      .container {
        width: 94%;
        margin-top: 22px;
      }

      .filtros {
        grid-template-columns: 1fr;

        padding: 15px;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .questao-card {
        border-radius: 15px;
      }

      .enunciado {
        font-size: 16px;
      }

      .alternativa {
        padding: 13px;
      }

      .btn-proxima {
        margin-left: 0;
        width: 100%;
      }

      .btn-secundario {
        flex: 1;
      }
    }
  </style>
</head>

<body>

  <header>

    <div class="logo">

      <div class="logo-marca">
        R
      </div>

      <div class="logo-texto">
        <strong>ROH Concursos</strong>
        <span>Área do aluno</span>
      </div>

    </div>

    <div class="topo-direita">

      <a
        class="btn-area"
        href="area.html"
      >
        Área do aluno
      </a>

      <span
        class="usuario"
        id="usuarioEmail"
      >
        Carregando...
      </span>

      <button
        class="btn-sair"
        id="btnSair"
        type="button"
      >
        Sair
      </button>

    </div>

  </header>

  <main class="container">

    <div class="cabecalho-pagina">

      <span>Banco de questões</span>

      <h1>Pratique por assunto</h1>

      <p>
        Escolha seu cargo, disciplina e assunto
        para iniciar seus estudos.
      </p>

    </div>

    <section class="filtros">

      <div class="campo">

        <label for="cargo">
          Cargo
        </label>

        <select id="cargo">
          <option value="">
            Carregando cargos...
          </option>
        </select>

      </div>

      <div class="campo">

        <label for="disciplina">
          Disciplina
        </label>

        <select
          id="disciplina"
          disabled
        >
          <option value="">
            Selecione o cargo
          </option>
        </select>

      </div>

      <div class="campo">

        <label for="assunto">
          Assunto
        </label>

        <select
          id="assunto"
          disabled
        >
          <option value="">
            Todos os assuntos
          </option>
        </select>

      </div>

      <button
        class="btn-carregar"
        id="btnCarregar"
        type="button"
        disabled
      >
        Buscar questões
      </button>

    </section>

    <section class="stats">

      <div class="stat">
        <span>Respondidas</span>
        <strong id="statRespondidas">0</strong>
      </div>

      <div class="stat">
        <span>Acertos</span>
        <strong id="statAcertos">0</strong>
      </div>

      <div class="stat">
        <span>Erros</span>
        <strong id="statErros">0</strong>
      </div>

      <div class="stat">
        <span>Aproveitamento</span>
        <strong id="statPercentual">0%</strong>
      </div>

    </section>

    <div
      class="mensagem"
      id="mensagem"
    >
      Selecione um cargo para começar.
    </div>

    <article
      class="questao-card"
      id="questaoCard"
    >

      <div class="questao-topo">

        <div
          class="questao-numero"
          id="questaoNumero"
        ></div>

        <div
          class="dificuldade"
          id="questaoDificuldade"
        ></div>

      </div>

      <div
        class="enunciado"
        id="enunciado"
      ></div>

      <div
        class="alternativas"
        id="alternativas"
      ></div>

      <div
        class="resultado"
        id="resultado"
      ></div>

      <div
        class="acoes"
        id="acoes"
      >

        <button
          class="btn-secundario"
          id="btnRevisao"
          type="button"
        >
          ☆ Marcar para revisão
        </button>

        <button
          class="btn-proxima"
          id="btnProxima"
          type="button"
        >
          Próxima questão →
        </button>

      </div>

    </article>

  </main>

  <script>

    const SUPABASE_URL =
      "https://tvbnkjirfryluhxwpnna.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_rCGzxynHFKgEeajIAWHNAw_7Qyw9HD_";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    const cargoSelect =
      document.getElementById("cargo");

    const disciplinaSelect =
      document.getElementById("disciplina");

    const assuntoSelect =
      document.getElementById("assunto");

    const btnCarregar =
      document.getElementById("btnCarregar");

    const btnSair =
      document.getElementById("btnSair");

    const usuarioEmail =
      document.getElementById("usuarioEmail");

    const mensagem =
      document.getElementById("mensagem");

    const questaoCard =
      document.getElementById("questaoCard");

    const questaoNumero =
      document.getElementById("questaoNumero");

    const questaoDificuldade =
      document.getElementById("questaoDificuldade");

    const enunciado =
      document.getElementById("enunciado");

    const alternativas =
      document.getElementById("alternativas");

    const resultado =
      document.getElementById("resultado");

    const acoes =
      document.getElementById("acoes");

    const btnRevisao =
      document.getElementById("btnRevisao");

    const btnProxima =
      document.getElementById("btnProxima");

    const statRespondidas =
      document.getElementById("statRespondidas");

    const statAcertos =
      document.getElementById("statAcertos");

    const statErros =
      document.getElementById("statErros");

    const statPercentual =
      document.getElementById("statPercentual");

    let usuarioAtual = null;

    let questoes = [];

    let indiceAtual = 0;

    let questaoAtual = null;

    let respondida = false;

    let estatisticas = {
      respondidas: 0,
      acertos: 0,
      erros: 0
    };

    function textoSeguro(valor) {

      if (
        valor === null ||
        valor === undefined
      ) {
        return "";
      }

      return String(valor);
    }

    function mostrarMensagem(
      texto,
      erro = false
    ) {

      questaoCard.style.display =
        "none";

      mensagem.style.display =
        "block";

      mensagem.textContent =
        texto;

      mensagem.className =
        erro
          ? "mensagem erro"
          : "mensagem";
    }

    function esconderMensagem() {

      mensagem.style.display =
        "none";
    }

    function atualizarEstatisticas() {

      statRespondidas.textContent =
        estatisticas.respondidas;

      statAcertos.textContent =
        estatisticas.acertos;

      statErros.textContent =
        estatisticas.erros;

      const percentual =
        estatisticas.respondidas
          ? Math.round(
              (
                estatisticas.acertos /
                estatisticas.respondidas
              ) * 100
            )
          : 0;

      statPercentual.textContent =
        percentual + "%";
    }

    async function verificarUsuario() {

      const {
        data,
        error
      } =
        await supabaseClient
          .auth
          .getSession();

      if (
        error ||
        !data.session
      ) {

        window.location.href =
          "login.html";

        return false;
      }

      usuarioAtual =
        data.session.user;

      usuarioEmail.textContent =
        usuarioAtual.email || "Aluno";

      try {

        const {
          data: ativo,
          error: erroAtivo
        } =
          await supabaseClient
            .rpc(
              "roh_usuario_ativo"
            );

        if (
          erroAtivo ||
          ativo !== true
        ) {

          await supabaseClient
            .auth
            .signOut();

          alert(
            "Seu acesso à ROH Concursos não está ativo."
          );

          window.location.href =
            "login.html";

          return false;
        }

      } catch (erro) {

        console.error(
          "Erro ao verificar usuário:",
          erro
        );

        return false;
      }

      return true;
    }

    async function carregarOpcoes(
      cargoId = null,
      disciplinaId = null
    ) {

      const {
        data,
        error
      } =
        await supabaseClient
          .rpc(
            "roh_opcoes_estudo_v1",
            {
              p_cargo_id:
                cargoId
                  ? Number(cargoId)
                  : null,

              p_disciplina_id:
                disciplinaId
                  ? Number(disciplinaId)
                  : null
            }
          );

      if (error) {

        console.error(
          "ROH opções:",
          error
        );

        throw error;
      }

      return data || {
        cargos: [],
        disciplinas: [],
        assuntos: []
      };
    }

    function obterIdCargo(item) {

      return (
        item.cargo_id ??
        item.id ??
        null
      );
    }

    function obterNomeCargo(item) {

      return textoSeguro(
        item.cargo_nome ??
        item.nome ??
        item.cargo ??
        ""
      );
    }

    function obterIdDisciplina(item) {

      return (
        item.disciplina_id ??
        item.id ??
        null
      );
    }

    function obterNomeDisciplina(item) {

      return textoSeguro(
        item.disciplina_nome ??
        item.nome ??
        item.disciplina ??
        ""
      );
    }

    function obterIdAssunto(item) {

      return (
        item.assunto_id ??
        item.id ??
        null
      );
    }

    function obterNomeAssunto(item) {

      return textoSeguro(
        item.assunto_nome ??
        item.nome ??
        item.assunto ??
        ""
      );
    }

    function preencherCargos(itens) {

      cargoSelect.innerHTML =
        '<option value="">Selecione seu cargo</option>';

      const usados =
        new Set();

      itens.forEach(item => {

        const id =
          obterIdCargo(item);

        const nome =
          obterNomeCargo(item);

        if (
          id === null ||
          !nome
        ) {
          return;
        }

        const chave =
          String(id);

        if (
          usados.has(chave)
        ) {
          return;
        }

        usados.add(chave);

        const option =
          document.createElement(
            "option"
          );

        option.value =
          chave;

        option.textContent =
          nome;

        cargoSelect.appendChild(
          option
        );
      });
    }

    function preencherDisciplinas(itens) {

      disciplinaSelect.innerHTML =
        '<option value="">Selecione a disciplina</option>';

      const usados =
        new Set();

      itens.forEach(item => {

        const id =
          obterIdDisciplina(item);

        const nome =
          obterNomeDisciplina(item);

        if (
          id === null ||
          !nome
        ) {
          return;
        }

        const chave =
          String(id);

        if (
          usados.has(chave)
        ) {
          return;
        }

        usados.add(chave);

        const option =
          document.createElement(
            "option"
          );

        option.value =
          chave;

        option.textContent =
          nome;

        disciplinaSelect.appendChild(
          option
        );
      });
    }

    function preencherAssuntos(itens) {

      assuntoSelect.innerHTML =
        '<option value="">Todos os assuntos</option>';

      const usados =
        new Set();

      itens.forEach(item => {

        const id =
          obterIdAssunto(item);

        const nome =
          obterNomeAssunto(item);

        if (
          id === null ||
          !nome
        ) {
          return;
        }

        const chave =
          String(id);

        if (
          usados.has(chave)
        ) {
          return;
        }

        usados.add(chave);

        const option =
          document.createElement(
            "option"
          );

        option.value =
          chave;

        option.textContent =
          nome;

        assuntoSelect.appendChild(
          option
        );
      });
    }

    async function carregarCargos() {

      cargoSelect.innerHTML =
        '<option value="">Carregando...</option>';

      cargoSelect.disabled =
        true;

      try {

        const dados =
          await carregarOpcoes(
            null,
            null
          );

        const cargos =
          Array.isArray(
            dados.cargos
          )
            ? dados.cargos
            : [];

        preencherCargos(
          cargos
        );

        cargoSelect.disabled =
          false;

        if (!cargos.length) {

          mostrarMensagem(
            "Nenhum cargo foi encontrado para sua conta."
          );

          return;
        }

        mostrarMensagem(
          "Selecione um cargo para começar."
        );

      } catch (erro) {

        console.error(
          "ROH cargos:",
          erro
        );

        mostrarMensagem(
          "Não foi possível carregar seus cargos.",
          true
        );
      }
    }

    cargoSelect.addEventListener(
      "change",
      async () => {

        disciplinaSelect.innerHTML =
          '<option value="">Carregando...</option>';

        disciplinaSelect.disabled =
          true;

        assuntoSelect.innerHTML =
          '<option value="">Todos os assuntos</option>';

        assuntoSelect.disabled =
          true;

        btnCarregar.disabled =
          true;

        questaoCard.style.display =
          "none";

        const cargoId =
          cargoSelect.value;

        if (!cargoId) {

          disciplinaSelect.innerHTML =
            '<option value="">Selecione o cargo</option>';

          mostrarMensagem(
            "Selecione um cargo para começar."
          );

          return;
        }

        mostrarMensagem(
          "Carregando disciplinas..."
        );

        try {

          const dados =
            await carregarOpcoes(
              cargoId,
              null
            );

          const disciplinas =
            Array.isArray(
              dados.disciplinas
            )
              ? dados.disciplinas
              : [];

          preencherDisciplinas(
            disciplinas
          );

          disciplinaSelect.disabled =
            false;

          if (!disciplinas.length) {

            mostrarMensagem(
              "Nenhuma disciplina foi encontrada para esse cargo."
            );

            return;
          }

          mostrarMensagem(
            "Agora selecione uma disciplina."
          );

        } catch (erro) {

          console.error(
            "ROH disciplinas:",
            erro
          );

          mostrarMensagem(
            "Não foi possível carregar as disciplinas.",
            true
          );
        }
      }
    );

    disciplinaSelect.addEventListener(
      "change",
      async () => {

        assuntoSelect.innerHTML =
          '<option value="">Todos os assuntos</option>';

        assuntoSelect.disabled =
          true;

        btnCarregar.disabled =
          true;

        questaoCard.style.display =
          "none";

        const cargoId =
          cargoSelect.value;

        const disciplinaId =
          disciplinaSelect.value;

        if (!disciplinaId) {

          mostrarMensagem(
            "Selecione uma disciplina."
          );

          return;
        }

        mostrarMensagem(
          "Carregando assuntos..."
        );

        try {

          const dados =
            await carregarOpcoes(
              cargoId,
              disciplinaId
            );

          const assuntos =
            Array.isArray(
              dados.assuntos
            )
              ? dados.assuntos
              : [];

          preencherAssuntos(
            assuntos
          );

          assuntoSelect.disabled =
            false;

          btnCarregar.disabled =
            false;

          mostrarMensagem(
            "Escolha um assunto ou mantenha “Todos os assuntos” e clique em Buscar questões."
          );

        } catch (erro) {

          console.error(
            "ROH assuntos:",
            erro
          );

          mostrarMensagem(
            "Não foi possível carregar os assuntos.",
            true
          );
        }
      }
    );

    async function buscarQuestoes() {

      const cargoId =
        cargoSelect.value;

      const disciplinaId =
        disciplinaSelect.value;

      const assuntoId =
        assuntoSelect.value;

      if (
        !cargoId ||
        !disciplinaId
      ) {

        mostrarMensagem(
          "Selecione cargo e disciplina.",
          true
        );

        return;
      }

      btnCarregar.disabled =
        true;

      btnCarregar.textContent =
        "Buscando...";

      mostrarMensagem(
        "Buscando questões..."
      );

      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .rpc(
              "roh_listar_questoes_estudo_v1",
              {
                p_cargo_id:
                  Number(cargoId),

                p_disciplina_id:
                  Number(disciplinaId),

                p_assunto_id:
                  assuntoId
                    ? Number(assuntoId)
                    : null,

                p_dificuldade:
                  null,

                p_limite:
                  50,

                p_somente_nao_respondidas:
                  false,

                p_embaralhar:
                  true
              }
            );

        if (error) {
          throw error;
        }

        questoes =
          Array.isArray(data)
            ? data
            : [];

        indiceAtual = 0;

        if (!questoes.length) {

          mostrarMensagem(
            "Nenhuma questão disponível para os filtros selecionados."
          );

          return;
        }

        exibirQuestao();

      } catch (erro) {

        console.error(
          "ROH questões:",
          erro
        );

        mostrarMensagem(
          "Não foi possível carregar as questões.",
          true
        );

      } finally {

        btnCarregar.disabled =
          false;

        btnCarregar.textContent =
          "Buscar questões";
      }
    }

    btnCarregar.addEventListener(
      "click",
      buscarQuestoes
    );

    function normalizarQuestao(q) {

      const opcoes = [];

      const alternativasObjeto =
        q.alternativas &&
        typeof q.alternativas === "object"
          ? q.alternativas
          : null;

      ["A", "B", "C", "D", "E"]
        .forEach(letra => {

          const minuscula =
            letra.toLowerCase();

          const texto =
            q[
              "alternativa_" +
              minuscula
            ]
            ??
            q[
              "alternativa_" +
              letra
            ]
            ??
            q[
              "alternativa" +
              letra
            ]
            ??
            (
              alternativasObjeto
                ? (
                    alternativasObjeto[letra]
                    ??
                    alternativasObjeto[minuscula]
                  )
                : null
            );

          if (
            texto !== null &&
            texto !== undefined &&
            String(texto).trim() !== ""
          ) {

            opcoes.push({
              letra,
              texto: String(texto)
            });
          }
        });

      return {
        id:
          q.id ??
          q.questao_id,

        enunciado:
          textoSeguro(
            q.enunciado ??
            q.questao ??
            q.texto
          ),

        dificuldade:
          textoSeguro(
            q.dificuldade ??
            ""
          ),

        alternativas:
          opcoes
      };
    }

    function exibirQuestao() {

      if (
        indiceAtual >=
        questoes.length
      ) {

        mostrarMensagem(
          "Você concluiu as questões carregadas. Clique em Buscar questões para continuar estudando."
        );

        return;
      }

      respondida = false;

      questaoAtual =
        normalizarQuestao(
          questoes[indiceAtual]
        );

      esconderMensagem();

      questaoCard.style.display =
        "block";

      questaoNumero.textContent =
        "Questão " +
        (indiceAtual + 1) +
        " de " +
        questoes.length;

      questaoDificuldade.textContent =
        questaoAtual.dificuldade ||
        "Questão";

      enunciado.textContent =
        questaoAtual.enunciado;

      alternativas.innerHTML =
        "";

      resultado.innerHTML =
        "";

      resultado.className =
        "resultado";

      acoes.className =
        "acoes";

      btnRevisao.textContent =
        "☆ Marcar para revisão";

      questaoAtual.alternativas
        .forEach(opcao => {

          const botao =
            document.createElement(
              "button"
            );

          botao.type =
            "button";

          botao.className =
            "alternativa";

          botao.dataset.letra =
            opcao.letra;

          const letra =
            document.createElement(
              "span"
            );

          letra.className =
            "letra";

          letra.textContent =
            opcao.letra;

          const texto =
            document.createElement(
              "span"
            );

          texto.textContent =
            opcao.texto;

          botao.appendChild(
            letra
          );

          botao.appendChild(
            texto
          );

          botao.addEventListener(
            "click",
            () =>
              responderQuestao(
                opcao.letra
              )
          );

          alternativas.appendChild(
            botao
          );
        });

      window.scrollTo({
        top:
          Math.max(
            0,
            questaoCard.offsetTop - 95
          ),
        behavior: "smooth"
      });
    }

    async function responderQuestao(
      respostaAluno
    ) {

      if (
        respondida ||
        !questaoAtual
      ) {
        return;
      }

      const botoes =
        alternativas.querySelectorAll(
          ".alternativa"
        );

      botoes.forEach(
        botao =>
          botao.disabled = true
      );

      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .rpc(
              "roh_responder_questao",
              {
                p_questao_id:
                  Number(
                    questaoAtual.id
                  ),

                p_resposta:
                  respostaAluno,

                p_origem:
                  "questoes"
              }
            );

        if (error) {
          throw error;
        }

        const r =
          data || {};

        const acertou =
          r.acertou
          ??
          r.correto
          ??
          r.is_correct
          ??
          false;

        const correta =
          r.resposta_correta
          ??
          r.correta
          ??
          r.gabarito
          ??
          r.correta_resposta
          ??
          r.alternativa_correta
          ??
          r.gabarito_ce
          ??
          null;

        const explicacao =
          r.explicacao
          ??
          "";

        const baseLegal =
          r.base_legal
          ??
          "";

        respondida = true;

        botoes.forEach(botao => {

          const letra =
            botao.dataset.letra;

          if (
            correta &&
            letra === String(correta)
          ) {

            botao.classList.add(
              "correta"
            );
          }

          if (
            !acertou &&
            letra === respostaAluno
          ) {

            botao.classList.add(
              "errada"
            );
          }
        });

        estatisticas.respondidas++;

        if (acertou) {

          estatisticas.acertos++;

        } else {

          estatisticas.erros++;
        }

        atualizarEstatisticas();

        resultado.className =
          acertou
            ? "resultado acerto"
            : "resultado erro";

        const titulo =
          document.createElement(
            "div"
          );

        titulo.className =
          "resultado-titulo";

        titulo.textContent =
          acertou
            ? "✓ Resposta correta!"
            : "✗ Resposta incorreta.";

        resultado.appendChild(
          titulo
        );

        if (explicacao) {

          const explicacaoEl =
            document.createElement(
              "div"
            );

          explicacaoEl.className =
            "explicacao";

          explicacaoEl.textContent =
            explicacao;

          resultado.appendChild(
            explicacaoEl
          );
        }

        if (baseLegal) {

          const baseEl =
            document.createElement(
              "div"
            );

          baseEl.className =
            "base-legal";

          baseEl.textContent =
            "Base legal/referência: " +
            baseLegal;

          resultado.appendChild(
            baseEl
          );
        }

        acoes.className =
          "acoes visivel";

      } catch (erro) {

        console.error(
          "ROH resposta:",
          erro
        );

        botoes.forEach(
          botao =>
            botao.disabled = false
        );

        alert(
          "Não foi possível registrar sua resposta."
        );
      }
    }

    btnProxima.addEventListener(
      "click",
      () => {

        indiceAtual++;

        exibirQuestao();
      }
    );

    btnRevisao.addEventListener(
      "click",
      async () => {

        if (
          !questaoAtual ||
          !respondida
        ) {
          return;
        }

        btnRevisao.disabled =
          true;

        try {

          const {
            error
          } =
            await supabaseClient
              .rpc(
                "roh_marcar_revisao",
                {
                  p_questao_id:
                    Number(
                      questaoAtual.id
                    )
                }
              );

          if (error) {
            throw error;
          }

          btnRevisao.textContent =
            "★ Marcada para revisão";

        } catch (erro) {

          console.error(
            "ROH revisão:",
            erro
          );

          alert(
            "Não foi possível marcar esta questão para revisão."
          );

        } finally {

          btnRevisao.disabled =
            false;
        }
      }
    );

    btnSair.addEventListener(
      "click",
      async () => {

        await supabaseClient
          .auth
          .signOut();

        window.location.href =
          "login.html";
      }
    );

    async function iniciar() {

      mostrarMensagem(
        "Verificando sua conta..."
      );

      try {

        const autenticado =
          await verificarUsuario();

        if (!autenticado) {
          return;
        }

        mostrarMensagem(
          "Carregando seus cargos..."
        );

        await carregarCargos();

      } catch (erro) {

        console.error(
          "ROH inicialização:",
          erro
        );

        mostrarMensagem(
          "Não foi possível iniciar a área de questões.",
          true
        );
      }
    }

    iniciar();

  </script>

</body>
