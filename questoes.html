<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071426">
<title>Questões | ROH Beta</title>
<link rel="stylesheet" href="assets/roh.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="assets/roh-core.js"></script>
</head>
<body>
<header class="topbar"><a class="brand" href="area.html"><span class="brand-mark">R</span><span class="brand-text"><strong>ROH Concursos</strong><span>Banco de questões</span></span></a><div class="top-actions"><a class="btn-ghost" href="area.html">Área do aluno</a><span class="user-email" data-user-email></span><button class="btn-ghost" data-logout>Sair</button></div></header>
<main class="page">
  <div class="eyebrow">Banco de questões</div><h1 class="title">Pratique por assunto</h1><p class="subtitle">As respostas e revisões ficam registradas no contexto do cargo selecionado.</p>
  <section class="filters"><div class="filter-grid">
    <div class="field"><label for="cargo">Cargo</label><select id="cargo"></select></div>
    <div class="field"><label for="disciplina">Disciplina</label><select id="disciplina" disabled><option>Selecione o cargo</option></select></div>
    <div class="field"><label for="assunto">Assunto</label><select id="assunto" disabled><option>Todos os assuntos</option></select></div>
    <div class="field"><label for="dificuldade">Dificuldade</label><select id="dificuldade"><option value="">Todas</option><option value="Fácil">Fácil</option><option value="Média">Média</option><option value="Difícil">Difícil</option></select></div>
    <div class="field"><label for="quantidade">Quantidade</label><select id="quantidade"><option>10</option><option selected>20</option><option>30</option><option>50</option></select></div>
    <div class="field"><label for="modo">Modo</label><select id="modo"><option value="todas">Todas</option><option value="nao_respondidas">Não respondidas</option><option value="erros">Somente erros</option></select></div>
    <div class="field" style="grid-column:span 2"><button id="buscar" class="btn-primary" style="width:100%" disabled>Buscar questões</button></div>
  </div></section>
  <section class="stats"><div class="stat"><span>Respondidas nesta sessão</span><strong id="respondidas">0</strong></div><div class="stat"><span>Acertos</span><strong id="acertos">0</strong></div><div class="stat"><span>Erros</span><strong id="erros">0</strong></div><div class="stat"><span>Aproveitamento</span><strong id="pct">0%</strong></div></section>
  <div id="msg" class="notice" role="status" aria-live="polite" aria-atomic="true">Selecione um cargo para começar.</div>
  <article id="question" class="question hidden">
    <div class="question-head"><span id="qnum" class="question-num"></span><span id="qdif" class="pill"></span></div>
    <div id="qmeta" class="meta"></div><div id="qtext" class="question-text"></div><div id="options" class="options"></div>
    <div id="answer" class="answer-box hidden" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="actions" class="actions hidden"><button id="review" class="btn-ghost">☆ Marcar para revisão</button><button id="next" class="btn-primary push">Próxima questão →</button></div>
  </article>
</main>
<script>
window.addEventListener("DOMContentLoaded",async()=>{
  while(!window.ROH) await new Promise(r=>setTimeout(r,30)); ROH.bindLogout();
  const cargo=ROH.el("cargo"),disc=ROH.el("disciplina"),ass=ROH.el("assunto"),buscar=ROH.el("buscar"),msg=ROH.el("msg");
  let items=[],idx=0,current=null,answered=false,stats={r:0,a:0,e:0};
  const show=(t,err=false)=>{msg.textContent=t;msg.className=`notice${err?" error":""}`;msg.classList.remove("hidden");ROH.el("question").classList.add("hidden")};
  const stat=()=>{ROH.el("respondidas").textContent=stats.r;ROH.el("acertos").textContent=stats.a;ROH.el("erros").textContent=stats.e;ROH.el("pct").textContent=stats.r?`${Math.round(stats.a/stats.r*100)}%`:"0%"};
  async function auth(){const s=await ROH.requireSession();if(!s)return false;ROH.setUserEmail(s);return true;}
  if(!(await auth())) return;
  try{await ROH.loadCargoSelect(cargo);}catch(e){show(e.message,true);return;}
  cargo.addEventListener("change",async()=>{disc.disabled=true;ass.disabled=true;buscar.disabled=true;disc.innerHTML="<option>Carregando...</option>";ass.innerHTML="<option>Todos os assuntos</option>";if(!cargo.value){show("Selecione um cargo.");return;}try{const d=await ROH.fillDisciplines(disc,cargo.value);disc.disabled=false;show(d.length?"Agora selecione uma disciplina.":"Nenhuma disciplina disponível.");}catch(e){show(e.message,true);}});
  disc.addEventListener("change",async()=>{ass.disabled=true;buscar.disabled=true;if(!disc.value){show("Selecione uma disciplina.");return;}try{await ROH.fillSubjects(ass,cargo.value,disc.value,true);ass.disabled=false;buscar.disabled=false;show("Defina os filtros e clique em Buscar questões.");}catch(e){show(e.message,true);}});
  buscar.addEventListener("click",async()=>{buscar.disabled=true;buscar.textContent="Buscando...";show("Buscando questões...");try{const modo=ROH.el("modo").value;const data=await ROH.rpc("roh_listar_questoes_estudo_v1",{p_cargo_id:Number(cargo.value),p_disciplina_id:Number(disc.value),p_assunto_id:ass.value?Number(ass.value):null,p_dificuldade:ROH.el("dificuldade").value||null,p_quantidade:Number(ROH.el("quantidade").value),p_somente_erros:modo==="erros",p_somente_nao_respondidas:modo==="nao_respondidas"});items=Array.isArray(data)?data:(Array.isArray(data?.questoes)?data.questoes:[]);idx=0;stats={r:0,a:0,e:0};stat();if(!items.length){show("Nenhuma questão disponível para estes filtros.");return;}render();}catch(e){console.error(e);show(e.message||"Não foi possível carregar as questões.",true);}finally{buscar.disabled=false;buscar.textContent="Buscar questões";}});
  function render(){if(idx>=items.length){show(`Sessão concluída: ${stats.a} acerto(s) em ${stats.r} resposta(s).`);return;}current=ROH.normalizedQuestion(items[idx]);answered=false;msg.classList.add("hidden");ROH.el("question").classList.remove("hidden");ROH.el("qnum").textContent=`Questão ${idx+1} de ${items.length}`;ROH.el("qdif").textContent=current.dificuldade||"Questão";ROH.el("qmeta").textContent=[current.disciplina,current.assunto].filter(Boolean).join(" • ");ROH.el("qtext").textContent=current.enunciado;ROH.el("answer").className="answer-box hidden";ROH.el("actions").className="actions hidden";ROH.el("review").textContent="☆ Marcar para revisão";ROH.renderAlternatives(ROH.el("options"),current,answer);}
  async function answer(letter){if(answered)return;ROH.el("options").querySelectorAll("button").forEach(b=>b.disabled=true);try{const r=await ROH.rpc("roh_responder_questao_v2",{p_questao_id:Number(current.id),p_cargo_id:Number(cargo.value),p_resposta:letter,p_origem:"questoes"});answered=true;ROH.markAlternatives(ROH.el("options"),letter,r.correta);stats.r++;if(r.acertou)stats.a++;else stats.e++;stat();const box=ROH.el("answer");box.className=`answer-box ${r.acertou?"ok":"bad"}`;box.innerHTML="";const st=document.createElement("strong");st.textContent=r.acertou?"✓ Resposta correta!":"✗ Resposta incorreta.";const ex=document.createElement("div");ex.textContent=r.explicacao||"";box.append(st,ex);if(r.base_legal){const b=document.createElement("div");b.className="base";b.textContent=`Base: ${r.base_legal}`;box.appendChild(b);}ROH.el("actions").className="actions";}catch(e){console.error(e);ROH.el("options").querySelectorAll("button").forEach(b=>b.disabled=false);alert(e.message||"Não foi possível registrar a resposta.");}}
  ROH.el("next").addEventListener("click",()=>{idx++;render();});
  ROH.el("review").addEventListener("click",async()=>{if(!current||!answered)return;const b=ROH.el("review");b.disabled=true;try{await ROH.rpc("roh_marcar_revisao_v2",{p_questao_id:Number(current.id),p_cargo_id:Number(cargo.value)});b.textContent="★ Marcada para revisão";}catch(e){alert(e.message||"Não foi possível marcar.");}finally{b.disabled=false;}});
});
</script>
</body>
</html>
