<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071426"><title>Calendário / Edital | ROH Beta</title><link rel="stylesheet" href="assets/roh.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/roh-core.js"></script></head><body>
<header class="topbar"><a class="brand" href="area.html"><span class="brand-mark">R</span><span class="brand-text"><strong>ROH Concursos</strong><span>Calendário e edital</span></span></a><div class="top-actions"><a class="btn-ghost" href="area.html">Área do aluno</a><span class="user-email" data-user-email></span><button class="btn-ghost" data-logout>Sair</button></div></header>
<main class="page"><div class="eyebrow">Fonte oficial</div><h1 class="title">Calendário / Edital</h1><p class="subtitle">Eventos publicados pela administração com fonte rastreável. Retificações substituem o evento anterior sem apagar o histórico administrativo.</p><section class="panel panel-pad" style="margin-top:24px"><div class="grid grid-2"><div class="field"><label>Concurso</label><select id="concurso"></select></div><div class="field"><button id="atualizar" class="btn-primary" style="width:100%;margin-top:19px">Atualizar</button></div></div><div id="status" class="notice">Carregando...</div><div id="eventos" class="list"></div></section></main>
<script>
window.addEventListener("DOMContentLoaded",async()=>{while(!window.ROH)await new Promise(r=>setTimeout(r,25));ROH.bindLogout();try{const s=await ROH.requireSession();if(!s)return;ROH.setUserEmail(s);const cs=await ROH.rpc("roh_meus_concursos")||[];const sel=ROH.el("concurso");sel.innerHTML="";const seen=new Set();cs.forEach(x=>{if(!seen.has(x.concurso_id)){seen.add(x.concurso_id);ROH.option(sel,x.concurso_id,`${x.concurso}${x.ano?` — ${x.ano}`:""}`)}});if(sel.options.length){await carregar();}else{setStatus("Nenhum concurso disponível para esta conta.",true)}}catch(e){setStatus(e.message||"Falha ao carregar calendário.",true)}});
ROH.el("atualizar")?.addEventListener("click",carregar);ROH.el("concurso")?.addEventListener("change",carregar);
function setStatus(t,e=false){const n=ROH.el("status");n.className=`notice${e?" error":""}`;n.textContent=t}
async function carregar(){const id=Number(ROH.el("concurso").value),box=ROH.el("eventos");box.innerHTML="";if(!id)return;try{const d=await ROH.rpc("roh_calendario_concurso_v1",{p_concurso_id:id});const ev=d.eventos||[];ev.forEach(e=>{const c=document.createElement("div");c.className="list-card";const h=document.createElement("h3");h.textContent=e.titulo;const p=document.createElement("p");p.textContent=e.descricao||"Sem descrição.";const meta=document.createElement("div");meta.className="meta";meta.textContent=`${e.tipo.toUpperCase()} · ${e.data_inicio?ROH.formatDate(e.data_inicio):"Data não informada"}${e.data_fim?` até ${ROH.formatDate(e.data_fim)}`:""} · Versão ${e.versao}`;const a=document.createElement("a");a.className="go";a.href=e.fonte_url;a.target="_blank";a.rel="noopener noreferrer";a.textContent=`Fonte oficial: ${e.fonte_nome} ↗`;c.append(h,p,meta,a);box.appendChild(c)});setStatus(ev.length?`${ev.length} evento(s) publicado(s).`:"Ainda não há eventos publicados para este concurso.");}catch(e){setStatus(e.message||"Falha ao carregar eventos.",true)}}
</script></body></html>
