<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071426"><meta name="robots" content="noindex,nofollow"><title>Alunos | ROH Beta</title><link rel="stylesheet" href="assets/roh.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="assets/roh-core.js"></script><script defer src="assets/roh-admin.js"></script></head><body>
<header class="topbar"><a class="brand" href="admin.html"><span class="brand-mark">R</span><span class="brand-text"><strong>ROH Concursos</strong><span>Gestão de alunos</span></span></a><div class="top-actions"><a class="btn-ghost" href="admin.html">Central</a><span class="user-email" data-user-email></span><button class="btn-ghost" data-logout>Sair</button></div></header>
<main class="page"><div class="eyebrow">Administração</div><h1 class="title">Alunos</h1><p class="subtitle">Busca e paginação executadas no backend. Senhas, tokens e dados internos do Auth não são exibidos.</p>
<section class="panel panel-pad" style="margin-top:24px"><div class="filter-grid"><div class="field" style="grid-column:span 2"><label>Buscar nome ou e-mail</label><input id="busca"></div><div class="field"><label>Status</label><select id="filtro"><option value="">Todos</option><option value="pendente">Pendente</option><option value="ativo">Ativo</option><option value="bloqueado">Bloqueado</option></select></div><div class="field"><button id="buscar" class="btn-primary" style="width:100%">Buscar</button></div></div><div id="statusLista" class="notice">Carregando...</div><div class="table-wrap"><table><thead><tr><th>Aluno</th><th>E-mail</th><th>Status</th><th>Cargos</th><th>Cadastro</th><th>Ação</th></tr></thead><tbody id="lista"></tbody></table></div><div class="actions"><button id="anterior" class="btn-ghost">← Anterior</button><button id="proxima" class="btn-ghost">Próxima →</button></div></section>
<section id="editor" class="panel panel-pad hidden" style="margin-top:24px"><h2 id="titulo" style="margin-top:0">Aluno</h2><p id="email" class="muted"></p><div class="field"><label>Status</label><select id="status"><option value="pendente">Pendente</option><option value="ativo">Ativo</option><option value="bloqueado">Bloqueado</option></select></div><h3>Cargos liberados</h3><div id="cargosBox" class="panel" style="padding:12px;max-height:360px;overflow:auto"></div><div class="actions"><button id="salvar" class="btn-primary">Salvar acesso</button><button id="fechar" class="btn-ghost">Fechar</button></div><div id="editStatus" class="notice">Nenhuma alteração enviada.</div></section></main>
<script>
const LIMIT=50;let offset=0,total=0,alunos=[],catalogo=[],selecionado=null;window.addEventListener("DOMContentLoaded",async()=>{try{if(!await ROHAdmin.init())return;await carregarCatalogo();await listar()}catch(e){ROHAdmin.notice("statusLista",e.message||"Falha ao iniciar.","error")}});ROH.el("buscar").addEventListener("click",()=>{offset=0;listar()});ROH.el("anterior").addEventListener("click",()=>{offset=Math.max(0,offset-LIMIT);listar()});ROH.el("proxima").addEventListener("click",()=>{offset+=LIMIT;listar()});ROH.el("fechar").addEventListener("click",()=>ROH.el("editor").classList.add("hidden"));
async function carregarCatalogo(){const concursos=await ROH.rpc("roh_admin_concursos_v2")||[];const t=[];for(const co of concursos){const cs=await ROH.rpc("roh_admin_cargos_concurso_v2",{p_concurso_id:Number(co.concurso_id)})||[];cs.filter(c=>c.ativo!==false).forEach(c=>t.push({id:Number(c.cargo_id),label:`${co.nome} → ${c.nome}`,nivel:c.nivel}))}catalogo=t.sort((a,b)=>a.label.localeCompare(b.label,"pt-BR"))}
function td(tr,v){const x=document.createElement("td");x.textContent=ROHAdmin.text(v);tr.appendChild(x)}async function listar(){try{const d=await ROH.rpc("roh_admin_listar_alunos_v2",{p_busca:ROH.el("busca").value||null,p_status:ROH.el("filtro").value||null,p_limite:LIMIT,p_offset:offset});alunos=d.itens||[];total=Number(d.total||0);const tb=ROH.el("lista");tb.innerHTML="";alunos.forEach(a=>{const tr=document.createElement("tr");td(tr,a.nome);td(tr,a.email);td(tr,a.status);td(tr,(a.cargos||[]).join("; ")||"Nenhum");td(tr,ROHAdmin.fmtDate(a.criado_em));const z=document.createElement("td"),b=document.createElement("button");b.className="btn-ghost";b.textContent="Gerenciar";b.onclick=()=>editar(a);z.appendChild(b);tr.appendChild(z);tb.appendChild(tr)});ROH.el("anterior").disabled=offset<=0;ROH.el("proxima").disabled=offset+LIMIT>=total;ROHAdmin.notice("statusLista",`${total} aluno(s); exibindo ${alunos.length}.`,"success")}catch(e){ROHAdmin.notice("statusLista",e.message||"Falha ao listar.","error")}}
function editar(a){selecionado=a;ROH.el("editor").classList.remove("hidden");ROH.el("titulo").textContent=a.nome||"Aluno";ROH.el("email").textContent=a.email||"";ROH.el("status").value=a.status;const ids=new Set((a.cargo_ids||[]).map(Number)),box=ROH.el("cargosBox");box.innerHTML="";catalogo.forEach(c=>{const l=document.createElement("label");l.style.cssText="display:flex;gap:10px;padding:9px;border-bottom:1px solid var(--border)";const k=document.createElement("input");k.type="checkbox";k.value=c.id;k.checked=ids.has(c.id);const s=document.createElement("span");s.textContent=`${c.label} · ${c.nivel}`;l.append(k,s);box.appendChild(l)});ROHAdmin.notice("editStatus","Revise o acesso antes de salvar.");window.scrollTo({top:ROH.el("editor").offsetTop-80,behavior:"smooth"})}
ROH.el("salvar").addEventListener("click",async()=>{if(!selecionado)return;const b=ROH.el("salvar");ROHAdmin.busy(b,true,"Salvando...");try{const st=ROH.el("status").value,ids=[...ROH.el("cargosBox").querySelectorAll('input:checked')].map(x=>Number(x.value));if(st!==selecionado.status)await ROH.rpc("roh_admin_alterar_status",{p_usuario_id:selecionado.id,p_status:st});await ROH.rpc("roh_admin_definir_cargos_ids",{p_usuario_id:selecionado.id,p_cargo_ids:ids});ROHAdmin.notice("editStatus","Acesso atualizado.","success");await listar();const n=alunos.find(x=>x.id===selecionado.id);if(n)editar(n)}catch(e){ROHAdmin.notice("editStatus",e.message||"Falha ao salvar.","error")}finally{ROHAdmin.busy(b,false)}});
</script></body></html>
