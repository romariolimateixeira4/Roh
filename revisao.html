<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071426">
<title>Revisão | ROH Beta</title>
<link rel="stylesheet" href="assets/roh.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="assets/roh-core.js"></script>
</head>
<body>
<header class="topbar"><a class="brand" href="area.html"><span class="brand-mark">R</span><span class="brand-text"><strong>ROH Concursos</strong><span>Revisão</span></span></a><div class="top-actions"><a class="btn-ghost" href="area.html">Área do aluno</a><span class="user-email" data-user-email></span><button class="btn-ghost" data-logout>Sair</button></div></header>
<main class="page">
  <div class="eyebrow">Revisão</div><h1 class="title">Volte ao que merece atenção</h1><p class="subtitle">A fila é separada por cargo para não misturar seu histórico entre contextos diferentes.</p>
  <section class="filters"><div class="filter-grid"><div class="field" style="grid-column:span 3"><label for="cargo">Cargo</label><select id="cargo"></select></div><div class="field"><button id="carregar" class="btn-primary" style="width:100%" disabled>Carregar revisão</button></div></div></section>
  <div id="status" class="notice" role="status" aria-live="polite" aria-atomic="true">Selecione um cargo.</div>
  <section id="lista" class="list"></section>
</main>
<script>
window.addEventListener("DOMContentLoaded",async()=>{
  while(!window.ROH) await new Promise(r=>setTimeout(r,30));ROH.bindLogout();const cargo=ROH.el("cargo"),btn=ROH.el("carregar"),status=ROH.el("status"),lista=ROH.el("lista");
  try{const s=await ROH.requireSession();if(!s)return;ROH.setUserEmail(s);await ROH.loadCargoSelect(cargo);}catch(e){status.className="notice error";status.textContent=e.message;return;}
  cargo.addEventListener("change",()=>{btn.disabled=!cargo.value;status.textContent=cargo.value?"Clique em Carregar revisão.":"Selecione um cargo.";lista.innerHTML="";});
  btn.addEventListener("click",load);
  async function load(){btn.disabled=true;btn.textContent="Carregando...";status.className="notice";status.textContent="Carregando sua fila...";lista.innerHTML="";try{const itens=await ROH.rpc("roh_minhas_revisoes_v2",{p_cargo_id:Number(cargo.value)});const arr=Array.isArray(itens)?itens:[];if(!arr.length){status.textContent="Nenhuma questão pendente de revisão neste cargo.";return;}status.textContent=`${arr.length} questão(ões) na revisão.`;arr.forEach((item,i)=>render(item,i));}catch(e){console.error(e);status.className="notice error";status.textContent=e.message||"Não foi possível carregar a revisão.";}finally{btn.disabled=false;btn.textContent="Carregar revisão";}}
  function render(item,i){const q=ROH.normalizedQuestion(item);const card=document.createElement("article");card.className="list-card";const n=document.createElement("div");n.className="question-num";n.textContent=`Questão ${i+1}`;const meta=document.createElement("div");meta.className="meta";meta.textContent=[item.disciplina,item.assunto,item.dificuldade].filter(Boolean).join(" • ");const text=document.createElement("p");text.style.color="var(--text)";text.textContent=q.enunciado;const actions=document.createElement("div");actions.className="actions";const remove=document.createElement("button");remove.className="btn-danger";remove.textContent="Remover da revisão";remove.addEventListener("click",async()=>{remove.disabled=true;try{await ROH.rpc("roh_remover_revisao_v2",{p_questao_id:Number(q.id),p_cargo_id:Number(cargo.value)});card.remove();status.className="notice success";status.textContent=lista.children.length?"Questão removida da revisão.":"Nenhuma questão pendente de revisão neste cargo.";}catch(e){status.className="notice error";status.textContent=e.message||"Não foi possível remover.";remove.disabled=false;}});actions.appendChild(remove);card.append(n,meta,text,actions);lista.appendChild(card);}
});
</script>
</body>
</html>
